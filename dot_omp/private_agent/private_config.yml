symbolPreset: nerd
composer:
  shape: pi
theme:
  dark: omarchy-system
  light: omarchy-system
setupVersion: 2
defaultThinkingLevel: medium
modelRoles:
  smol: openai-codex/gpt-6-luna:xhigh
  slow: openai-codex/gpt-6-luna:xhigh
  vision: openai-codex/gpt-6-luna:xhigh
  plan: openai-codex/gpt-6-luna:xhigh
  designer: openai-codex/gpt-6-luna:xhigh
  commit: openai-codex/gpt-6-luna:xhigh
  tiny: openai-codex/gpt-6-luna:xhigh
  task: openai-codex/gpt-6-luna:xhigh
  advisor: openai-codex/gpt-6-luna:xhigh
  BUILDER: openai-codex/gpt-6-luna:xhigh
  CRITIC: openai-codex/gpt-6-luna:xhigh
  memory: openai-codex/gpt-6-luna:xhigh
github:
  enabled: true
hideThinkingBlock: true
startup:
  checkUpdate: false
statusLine:
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - quota
  rightSegments:
    - session_name
  separator: powerline-thin
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
dev:
  autoqaConsent: denied
omitThinking: true
skills:
  # ~/.agents/skills and ~/.claude/skills both link to ~/dev/skills/skills;
  # read it once, through ~/.agents/skills.
  enableClaudeUser: false
