symbolPreset: nerd
composer: 
  shape: pi
theme: 
  dark: dark-tokyo-night
setupVersion: 2
defaultThinkingLevel: medium
modelRoles: 
  default: anthropic/claude-opus-5:medium
github: 
  enabled: true
hideThinkingBlock: true
startup: 
  checkUpdate: false
statusLine: 
  preset: custom
  leftSegments: 
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - quota
  rightSegments: 
    - session_name
  separator: powerline-thin
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git: 
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true