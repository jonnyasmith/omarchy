symbolPreset: nerd
composer:
  shape: pi
theme:
  dark: omarchy-system
  light: omarchy-system
setupVersion: 2
defaultThinkingLevel: medium
modelRoles:
  default: anthropic/claude-opus-5:medium
  smol: openai-codex/gpt-5.6-terra:medium
  slow: openai-codex/gpt-5.6-terra:medium
  vision: openai-codex/gpt-5.6-terra:medium
  plan: openai-codex/gpt-5.6-terra:medium
  designer: openai-codex/gpt-5.6-terra:medium
  commit: openai-codex/gpt-5.6-terra:medium
  tiny: anthropic/claude-haiku-4-5:high
  task: openai-codex/gpt-5.6-terra:medium
  advisor: openai-codex/gpt-5.6-terra:medium
  BUILDER: anthropic/claude-opus-5:medium
  CRITIC: openai-codex/gpt-5.6-sol:medium
github:
  enabled: true
hideThinkingBlock: true
startup:
  checkUpdate: false
statusLine:
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - quota
  rightSegments:
    - session_name
  separator: powerline-thin
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
dev:
  autoqaConsent: denied
omitThinking: true