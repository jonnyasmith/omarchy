symbolPreset: nerd
composer:
  shape: pi
theme:
  dark: omarchy-system
  light: omarchy-system
setupVersion: 2
defaultThinkingLevel: medium
modelRoles:
  default: anthropic/claude-opus-5:medium
  smol: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:medium
  vision: anthropic/claude-opus-5:medium
  plan: anthropic/claude-opus-5:medium
  designer: anthropic/claude-opus-5:medium
  commit: anthropic/claude-opus-5:medium
  tiny: anthropic/claude-haiku-4-5:high
  task: anthropic/claude-opus-5:medium
  advisor: anthropic/claude-opus-5:medium
github:
  enabled: true
hideThinkingBlock: true
startup:
  checkUpdate: false
statusLine:
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - quota
  rightSegments:
    - session_name
  separator: powerline-thin
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true