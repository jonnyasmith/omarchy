# AirPlay (RAOP) speaker discovery: every device answering _raop._tcp on the
# LAN becomes a normal PipeWire sink, so HomePods and Apple TVs can be selected
# like local outputs.
#
# This must load the native PipeWire module. Loading PulseAudio compatibility's
# `module-raop-discover` makes the same sinks visible, but no usable RAOP
# session: selecting one appears to work while audio remains silent.
#
# The explicit create-stream action follows PipeWire's documented setup and is
# load-bearing for HomePods. `pipewire-zeroconf` supplies the module; the
# packages bootstrap installs it before chezmoi applies this file.
#
# RAOP over UDP also requires replies to this machine's control and timing
# ports, UDP 6001:6002. run_after_airplay-firewall.sh opens only those two ports
# to this house's LAN; without that rule HomePod accepts OPTIONS and ANNOUNCE,
# then SETUP hangs forever and no sound plays.
context.modules = [
    { name = libpipewire-module-raop-discover
        args = {
            stream.rules = [
                { matches = [ { raop.ip = "~.*" } ]
                    actions = {
                        create-stream = {
                            stream.props = {
                                media.class = "Audio/Sink"
                            }
                        }
                    }
                }
            ]
        }
    }
]
