# AirPlay (RAOP) speaker discovery: every device answering _raop._tcp on the
# LAN becomes a normal PipeWire sink, so the HomePods and Apple TVs in the
# house can be picked like any other output.
#
# Loaded through pipewire-pulse rather than the pipewire daemon on purpose.
# The documented route is a `context.modules` entry in pipewire.conf.d, and it
# has two problems:
#
#   * that entry is mandatory. With `pipewire-zeroconf` absent, the daemon
#     exits 254 with "could not load mandatory module" and takes wireplumber
#     and pipewire-pulse down with it -- the machine has no audio at all until
#     the file is removed. Here `nofail` makes a missing module a log line.
#   * an AirPlay sink is destroyed the moment its RTSP connection breaks
#     (module-raop-sink logs "error -32" when the device hangs up after a
#     stream, which HomePods do), and discovery does not re-announce it. The
#     only repair is to reload the discovery module, and a module loaded by the
#     daemon cannot be reloaded without restarting the whole audio stack.
#     A pulse-loaded module is `pactl unload-module module-raop-discover`
#     followed by `pactl load-module module-raop-discover`, which is what the
#     picker's rescan key does.
#
# Requires the pipewire-zeroconf package (libpipewire-module-raop-discover)
# and a running avahi-daemon for the mDNS half.
pulse.cmd = [
    { cmd = "load-module" args = "module-raop-discover" flags = [ nofail ] }
]
